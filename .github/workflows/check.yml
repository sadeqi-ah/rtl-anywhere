name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must run before setup-node, so that `cache: pnpm` can find the binary.
      # The version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser smoke tests run through Playwright, so CI needs a browser binary.
      - run: pnpm exec playwright install chromium --with-deps
      # Keep CI aligned with the local gate documented in package.json.
      # This includes formatting, TypeScript, Node tests, bundle freshness, and browser smoke tests.
      - run: pnpm run check
